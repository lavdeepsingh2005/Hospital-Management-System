{% extends 'base.html' %}

{% block title %}
Doctors
{% endblock title %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-dark text-white">Register Doctor</div>
            <div class="card-body">
                <form action="{{ url_for('doctors') }}" method="post">
                    <div class="form-group">
                        <label for="doctorname">Doctor full name</label>
                        <input type="text" class="form-control" id="doctorname" name="doctorname" required>
                    </div>
                    <div class="form-group">
                        <label for="dept_id">Department</label>
                        <select class="form-control" id="dept_id" name="dept_id" required>
                            <option value="">Select department</option>
                            {% for dept in depts %}
                                <option value="{{ dept.dept_id }}">{{ dept.dept_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="email">Doctor login email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Temporary password</label>
                        <input type="password" class="form-control" id="password" name="password" value="default123" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" class="form-control" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="qualification">Qualification</label>
                        <input type="text" class="form-control" id="qualification" name="qualification">
                    </div>
                    <div class="form-group">
                        <label for="experience_yrs">Experience (years)</label>
                        <input type="number" min="0" class="form-control" id="experience_yrs" name="experience_yrs" value="0">
                    </div>
                    <button type="submit" class="btn btn-dark btn-block">Create Doctor</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock body %}
